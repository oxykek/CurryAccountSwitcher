plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation files('libs/waybackauthlib-1.1.0.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE')
    from('libs/waybackauthlib-1.1.0.jar') { into 'META-INF/jars' }
}

sourceSets {
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('qaJar', Jar) {
    archiveClassifier = 'qa-dev'
    from sourceSets.qa.output
}

tasks.register('remapQaJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('qaJar')
    inputFile = tasks.named('qaJar').flatMap { it.archiveFile }
    archiveClassifier = 'qa'
    sourceNamespace = 'named'
    targetNamespace = 'intermediary'
    classpath.from(sourceSets.qa.compileClasspath)
}
